# ============================================================================
# Experiment
# ============================================================================

exp_name: sac
algo_name: sac

seed: 67
torch_deterministic: true
cuda: true

# ============================================================================
# Weights & Biases
# ============================================================================

# ============================================================================
# Weights & Biases
# ============================================================================
track: true
wandb_project_name: default
wandb_entity: null
wandb_offline: false


capture_video: false

# ============================================================================
# Environment
# ============================================================================

env_id: default
num_envs: 1

# ============================================================================
# Training
# ============================================================================

total_timesteps: 1024000
learning_starts: 5000
batch_size: 256

# ============================================================================
# Replay Buffer
# ============================================================================

buffer_size: 1000000

# ============================================================================
# Reinforcement Learning
# ============================================================================

gamma: 0.99
tau: 0.005

# ============================================================================
# Optimizers
# ============================================================================

policy_lr: 0.0003
q_lr: 0.001

# ============================================================================
# SAC
# ============================================================================

policy_frequency: 2
target_network_frequency: 1

alpha: 0.2
autotune: true

# ============================================================================
# Checkpointing
# ============================================================================

interval_save: 30